<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>练习场 · Playwright 练习应用</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; margin-top: 16px; }
    section h2 { margin-top: 0; font-size: 18px; }
    button { margin-right: 8px; }
    .tip-wrap { position: relative; display: inline-block; border-bottom: 1px dotted #555; cursor: help; }
    .tip-wrap .tip { display: none; position: absolute; bottom: 130%; left: 0; background: #333; color: #fff; padding: 6px 10px; border-radius: 4px; white-space: nowrap; }
    .tip-wrap:hover .tip { display: block; }
    .drag-pool { min-height: 56px; border: 2px dashed #bbb; border-radius: 8px; padding: 10px; margin: 8px 0; color: #999; }
    .drag-chip { display: inline-block; background: #4a90d9; color: #fff; padding: 6px 14px; border-radius: 14px; cursor: grab; user-select: none; }
  </style>
</head>
<body>
  <h1>练习场</h1>
  <p>这一页集中了自动化测试中的常见考点，每个区块对应一类交互。</p>

  <section id="dialog-section">
    <h2>弹窗对话框</h2>
    <button id="alert-btn">弹出 Alert</button>
    <button id="confirm-btn">弹出 Confirm</button>
    <p id="confirm-result"></p>
  </section>

  <section id="slow-section">
    <h2>慢速内容（练习自动等待）</h2>
    <button id="slow-load" data-testid="slow-load-trigger">加载慢速内容（约 2 秒）</button>
    <ul id="slow-list"></ul>
  </section>

  <section id="lazy-section">
    <h2>动态列表</h2>
    <button id="load-more">加载更多</button>
    <ul id="lazy-list">
      <li>条目 1</li>
      <li>条目 2</li>
    </ul>
  </section>

  <section id="upload-section">
    <h2>文件上传</h2>
    <input id="file-input" type="file" aria-label="选择文件" />
    <p id="upload-result">尚未选择文件</p>
  </section>

  <section id="enable-section">
    <h2>启用与禁用</h2>
    <label><input id="agree" type="checkbox" /> 我已阅读说明</label>
    <button id="submit-btn" disabled>提交</button>
    <p id="submit-result"></p>
  </section>

  <section id="hover-section">
    <h2>悬停提示</h2>
    <p>把鼠标悬停在 <span class="tip-wrap" id="hover-target">这段文字<span class="tip" id="hover-tip">悬停提示出现了</span></span> 上。</p>
  </section>

  <section id="form-section">
    <h2>下拉选择</h2>
    <label for="fruit-select">选择水果</label>
    <select id="fruit-select">
      <option value="">请选择…</option>
      <option value="apple">苹果</option>
      <option value="banana">香蕉</option>
      <option value="cherry">樱桃</option>
    </select>
    <p id="select-result">尚未选择</p>
  </section>

  <section id="drag-section">
    <h2>拖拽</h2>
    <div class="drag-pool" id="drag-source">
      <span class="drag-chip" id="drag-chip">积木</span>
    </div>
    <div class="drag-pool" id="drag-target">放到这里</div>
  </section>

  <section id="tabs-section">
    <h2>多标签页</h2>
    <p><a href="/iframe-inner.html" target="_blank" rel="noopener" id="new-tab-link">在新标签页打开帮助页</a></p>
  </section>

  <section id="iframe-section">
    <h2>iframe 内嵌页面</h2>
    <iframe id="iframe-box" src="/iframe-inner.html" width="100%" height="160" title="iframe 示例"></iframe>
  </section>

  <script>
    // 弹窗
    document.getElementById('alert-btn').addEventListener('click', () => {
      window.alert('这是一个 Alert 弹窗');
    });
    document.getElementById('confirm-btn').addEventListener('click', () => {
      const yes = window.confirm('确定要继续吗？');
      document.getElementById('confirm-result').textContent = yes ? '已选择：确定' : '已选择：取消';
    });

    // 慢速内容
    let slowCount = 0;
    document.getElementById('slow-load').addEventListener('click', async (e) => {
      const btn = e.target;
      btn.disabled = true;
      await fetch('/api/slow?ms=2000');
      slowCount += 1;
      const li = document.createElement('li');
      li.textContent = `第 ${slowCount} 次加载完成`;
      document.getElementById('slow-list').appendChild(li);
      btn.disabled = false;
    });

    // 动态列表
    let item = 2;
    document.getElementById('load-more').addEventListener('click', () => {
      for (let i = 0; i < 3; i++) {
        item += 1;
        const li = document.createElement('li');
        li.textContent = `条目 ${item}`;
        document.getElementById('lazy-list').appendChild(li);
      }
    });

    // 文件上传
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      document.getElementById('upload-result').textContent =
        file ? `已选择：${file.name}（${file.size} 字节）` : '尚未选择文件';
    });

    // 启用与禁用
    document.getElementById('agree').addEventListener('change', (e) => {
      document.getElementById('submit-btn').disabled = !e.target.checked;
    });
    document.getElementById('submit-btn').addEventListener('click', () => {
      document.getElementById('submit-result').textContent = '提交成功';
    });

    // 下拉选择
    document.getElementById('fruit-select').addEventListener('change', (e) => {
      const value = e.target.value;
      const label = e.target.selectedOptions[0] ? e.target.selectedOptions[0].textContent : '';
      document.getElementById('select-result').textContent =
        value ? `已选择：${label}（value=${value}）` : '尚未选择';
    });

    // 拖拽：用 mouse 事件实现（而非 HTML5 draggable）——
    // Playwright 的 dragTo 走 mouse down/move/up 序列，本实现可直接被驱动
    (() => {
      const chip = document.getElementById('drag-chip');
      const target = document.getElementById('drag-target');
      let dragging = false;

      chip.addEventListener('mousedown', () => { dragging = true; });
      document.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        chip.style.position = 'fixed';
        chip.style.left = `${e.clientX}px`;
        chip.style.top = `${e.clientY}px`;
      });
      document.addEventListener('mouseup', (e) => {
        if (!dragging) return;
        dragging = false;
        chip.style.position = '';
        const over = document.elementFromPoint(e.clientX, e.clientY);
        if (over && target.contains(over)) {
          target.textContent = '已放入：';
          target.appendChild(chip);
        }
      });
    })();
  </script>
</body>
</html>
